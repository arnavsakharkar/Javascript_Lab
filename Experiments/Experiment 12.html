<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Campus Events</title>

<style>
:root {
    --primary: #3158b7;
    --header: #263f80;
    --background: #f2f5fb;
    --border: #dfe5f0;
    --text: #17243c;
    --muted: #63718a;
    --white: #ffffff;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: var(--background);
    color: var(--text);
    font-size: 14px;
}

header {
    background: var(--header);
    color: white;
    padding: 18px 10px;
}

header h1 {
    font-size: 22px;
    margin: 0 0 6px;
}

header p {
    font-size: 12px;
    color: #dbe5ff;
    margin: 0;
}

main {
    width: min(860px, calc(100% - 30px));
    margin: 16px auto 35px;
}

.panel {
    background: var(--white);
    padding: 14px;
    margin-bottom: 18px;
    border-radius: 10px;
    box-shadow: 0 4px 14px rgba(30, 50, 90, 0.07);
}

.panel h2 {
    font-size: 16px;
    margin: 12px 0;
}

.toolbar {
    display: flex;
    gap: 6px;
    margin-bottom: 8px;
}

input, select, textarea {
    font-family: inherit;
    font-size: 12px;
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 8px;
    background: white;
    color: var(--text);
    outline: none;
}

input:focus, select:focus, textarea:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 2px rgba(49, 88, 183, 0.1);
}

#searchInput {
    flex: 1;
    min-width: 0;
}

#categoryFilter {
    width: 125px;
}

.message {
    color: var(--header);
    font-size: 12px;
    min-height: 17px;
    margin: 8px 0;
}

.event-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 10px;
}

.event-card {
    border: 1px solid #e6eaf2;
    border-radius: 9px;
    padding: 10px;
    min-width: 0;
    background: white;
}

.event-card h3 {
    color: #304e96;
    font-size: 13px;
    line-height: 1.4;
    margin: 0 0 10px;
}

.description {
    font-size: 12px;
    line-height: 1.45;
    margin: 0 0 8px;
    overflow-wrap: anywhere;
}

.event-meta {
    color: var(--muted);
    font-size: 11px;
    line-height: 1.45;
    margin: 7px 0;
}

.seat-info {
    font-size: 11px;
    color: var(--muted);
    margin: 8px 0 12px;
}

button {
    border: none;
    border-radius: 5px;
    padding: 7px 9px;
    background: var(--primary);
    color: white;
    font-size: 11px;
    cursor: pointer;
    transition: background 0.2s, transform 0.15s;
}

button:hover {
    background: #244493;
}

button:active {
    transform: scale(0.98);
}

button.secondary {
    background: #e8edfb;
    color: #344d89;
}

button.secondary:hover {
    background: #d7e0f8;
}

button.danger {
    background: #fce9e9;
    color: #a32929;
}

button.danger:hover {
    background: #f7d7d7;
}

button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

.button-row {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
}

.registration-form {
    display: none;
    background: #f5f7fc;
    border-radius: 6px;
    padding: 9px;
    margin-top: 8px;
}

.registration-form.show {
    display: block;
}

.registration-form label {
    display: block;
    font-size: 11px;
    margin: 0 0 4px;
}

.registration-form input {
    width: 100%;
    margin-bottom: 8px;
    background: #e9effb;
}

.registration-form .button-row {
    margin-top: 2px;
}

.my-registrations {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
}

.registration-card {
    border: 1px solid #e5eaf3;
    padding: 10px;
    border-radius: 8px;
}

.registration-card h3 {
    color: #304e96;
    font-size: 13px;
    margin: 0 0 10px;
}

.registration-card p {
    font-size: 12px;
    line-height: 1.5;
    margin: 7px 0;
}

.registered-by {
    color: var(--muted);
    font-size: 11px !important;
    overflow-wrap: anywhere;
}

.organizer-form {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 7px;
}

.organizer-form input,
.organizer-form select,
.organizer-form textarea {
    width: 100%;
}

.organizer-form .full {
    grid-column: 1 / -1;
}

.organizer-form textarea {
    height: 55px;
    resize: vertical;
}

.organizer-form button {
    grid-column: 1 / -1;
    padding: 10px;
}

.empty-state {
    grid-column: 1 / -1;
    padding: 20px 10px;
    text-align: center;
    border: 1px dashed var(--border);
    border-radius: 8px;
    color: var(--muted);
    font-size: 12px;
}

footer {
    text-align: center;
    padding: 10px;
    font-size: 11px;
    color: var(--muted);
}

@media (max-width: 650px) {
    header {
        padding: 17px 15px;
    }

    main {
        width: calc(100% - 20px);
        margin-top: 10px;
    }

    .event-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .organizer-form {
        grid-template-columns: repeat(2, minmax(0, 1fr));
    }
}

@media (max-width: 430px) {
    .event-grid,
    .my-registrations {
        grid-template-columns: 1fr;
    }

    .toolbar {
        flex-wrap: wrap;
    }

    #searchInput {
        flex-basis: 100%;
    }

    #categoryFilter {
        width: 100%;
    }

    .organizer-form {
        grid-template-columns: 1fr;
    }

    .organizer-form .full,
    .organizer-form button {
        grid-column: auto;
    }
}
</style>
</head>

<body>

<header>
    <h1>Campus Events</h1>
    <p>Discover events and workshops, then register in a few clicks.</p>
</header>

<main>

    <!-- Browse Events -->
    <section class="panel">
        <h2>Browse Events</h2>

        <div class="toolbar">
            <input
                type="search"
                id="searchInput"
                placeholder="Search events..."
                aria-label="Search events"
            >

            <select id="categoryFilter" aria-label="Filter by category">
                <option value="">All categories</option>
                <option value="Workshop">Workshop</option>
                <option value="Career">Career</option>
                <option value="Seminar">Seminar</option>
                <option value="Technology">Technology</option>
                <option value="Other">Other</option>
            </select>
        </div>

        <div id="message" class="message" role="status" aria-live="polite"></div>

        <div id="eventsList" class="event-grid"></div>
    </section>

    <!-- My Registrations -->
    <section class="panel">
        <h2>My Registrations</h2>
        <div id="registrationsList" class="my-registrations"></div>
    </section>

    <!-- Organizer -->
    <section class="panel">
        <h2>Organizer: Add an Event</h2>

        <form id="eventForm" class="organizer-form">

            <input
                class="full"
                type="text"
                id="eventTitle"
                placeholder="Event title"
                maxlength="100"
                required
            >

            <textarea
                class="full"
                id="eventDescription"
                placeholder="Description"
                maxlength="500"
                required
            ></textarea>

            <select id="eventCategory" required>
                <option value="Workshop">Workshop</option>
                <option value="Career">Career</option>
                <option value="Seminar">Seminar</option>
                <option value="Technology">Technology</option>
                <option value="Other">Other</option>
            </select>

            <input type="datetime-local" id="eventDate" required>

            <input
                type="text"
                id="eventLocation"
                placeholder="Location"
                maxlength="100"
                required
            >

            <input
                type="number"
                id="eventCapacity"
                placeholder="Capacity"
                min="1"
                max="100000"
                required
            >

            <button type="submit">Add Event</button>
        </form>
    </section>

</main>

<footer>
    Campus Events Management System · Built with HTML, CSS & JavaScript
</footer>

<script>
"use strict";

// -----------------------------------------
// STORAGE AND INITIAL DATA
// -----------------------------------------

const STORAGE_KEY = "campusEventsData_v1";

function makeInitialDate(daysFromNow, hour, minute = 0) {
    const date = new Date();
    date.setDate(date.getDate() + daysFromNow);
    date.setHours(hour, minute, 0, 0);

    // Format for datetime-local: YYYY-MM-DDTHH:mm
    const pad = number => String(number).padStart(2, "0");

    return (
        date.getFullYear() + "-" +
        pad(date.getMonth() + 1) + "-" +
        pad(date.getDate()) + "T" +
        pad(date.getHours()) + ":" +
        pad(date.getMinutes())
    );
}

function getInitialData() {
    return {
        events: [
            {
                id: "event-1",
                title: "Web Development Workshop",
                description: "Build an interactive webpage using HTML, CSS, and JavaScript.",
                category: "Workshop",
                date: makeInitialDate(21, 14),
                location: "Computer Lab 2",
                capacity: 30
            },
            {
                id: "event-2",
                title: "Career Paths in Technology",
                description: "Meet professionals and learn about technology careers.",
                category: "Career",
                date: makeInitialDate(27, 16, 30),
                location: "Student Center",
                capacity: 50
            },
            {
                id: "event-3",
                title: "Research Skills Seminar",
                description: "Learn practical strategies for finding and evaluating sources.",
                category: "Seminar",
                date: makeInitialDate(31, 10),
                location: "Library Room 4",
                capacity: 25
            }
        ],
        registrations: []
    };
}

function loadData() {
    try {
        const saved = localStorage.getItem(STORAGE_KEY);

        if (saved) {
            const parsed = JSON.parse(saved);

            if (
                parsed &&
                Array.isArray(parsed.events) &&
                Array.isArray(parsed.registrations)
            ) {
                return parsed;
            }
        }
    } catch (error) {
        console.error("Unable to load saved data:", error);
    }

    return getInitialData();
}

let data = loadData();

function saveData() {
    try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        return true;
    } catch (error) {
        console.error("Unable to save data:", error);
        showMessage("Could not save changes. Browser storage may be full.");
        return false;
    }
}

// -----------------------------------------
// ELEMENTS
// -----------------------------------------

const eventsList = document.getElementById("eventsList");
const registrationsList = document.getElementById("registrationsList");
const searchInput = document.getElementById("searchInput");
const categoryFilter = document.getElementById("categoryFilter");
const message = document.getElementById("message");
const eventForm = document.getElementById("eventForm");

// Demo student profile.
// Registration details are collected through the registration form.

let currentStudent = null;

function showMessage(text) {
    message.textContent = text;
}

// -----------------------------------------
// FORMAT DATE
// -----------------------------------------

function formatDate(dateString) {
    const date = new Date(dateString);

    if (Number.isNaN(date.getTime())) {
        return "Date not available";
    }

    return new Intl.DateTimeFormat("en-IN", {
        day: "numeric",
        month: "short",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit",
        hour12: false
    }).format(date);
}

// -----------------------------------------
// REGISTRATION HELPERS
// -----------------------------------------

function getEventRegistrations(eventId) {
    return data.registrations.filter(
        registration => registration.eventId === eventId
    );
}

function getRegisteredCount(eventId) {
    return getEventRegistrations(eventId).length;
}

function isRegistered(eventId) {
    return data.registrations.some(registration =>
        registration.eventId === eventId &&
        currentStudent &&
        registration.studentId.toLowerCase() ===
            currentStudent.studentId.toLowerCase()
    );
}

// -----------------------------------------
// RENDER EVENTS
// -----------------------------------------

function renderEvents() {
    const searchTerm = searchInput.value.trim().toLowerCase();
    const selectedCategory = categoryFilter.value;

    const filteredEvents = data.events.filter(event => {
        const matchesSearch = (
            event.title.toLowerCase().includes(searchTerm) ||
            event.description.toLowerCase().includes(searchTerm) ||
            event.location.toLowerCase().includes(searchTerm)
        );

        const matchesCategory = (
            !selectedCategory ||
            event.category === selectedCategory
        );

        return matchesSearch && matchesCategory;
    });

    eventsList.replaceChildren();

    if (filteredEvents.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty-state";
        empty.textContent = "No events found. Try another search.";
        eventsList.appendChild(empty);
        return;
    }

    filteredEvents.forEach(event => {
        const registered = getRegisteredCount(event.id);
        const full = registered >= Number(event.capacity);
        const studentRegistered = isRegistered(event.id);

        const card = document.createElement("article");
        card.className = "event-card";

        const title = document.createElement("h3");
        title.textContent = event.title;

        const description = document.createElement("p");
        description.className = "description";
        description.textContent = event.description;

        const meta = document.createElement("div");
        meta.className = "event-meta";
        meta.textContent =
            `${event.category} · ${formatDate(event.date)} · ${event.location}`;

        const seats = document.createElement("p");
        seats.className = "seat-info";
        seats.textContent = `${registered}/${event.capacity} seats filled`;

        const buttons = document.createElement("div");
        buttons.className = "button-row";

        const registrationButton = document.createElement("button");

        if (studentRegistered) {
            registrationButton.textContent = "Cancel registration";
            registrationButton.addEventListener("click", () => {
                cancelRegistration(event.id);
            });
        } else {
            registrationButton.textContent = "Register";
            registrationButton.disabled = full;

            registrationButton.addEventListener("click", () => {
                showRegistrationForm(event.id);
            });
        }

        buttons.appendChild(registrationButton);

        const deleteButton = document.createElement("button");
        deleteButton.className = "secondary";
        deleteButton.textContent = "Delete event";

        deleteButton.addEventListener("click", () => {
            deleteEvent(event.id);
        });

        buttons.appendChild(deleteButton);

        const registrationForm = document.createElement("form");
        registrationForm.className = "registration-form";
        registrationForm.dataset.eventId = event.id;

        const nameLabel = document.createElement("label");
        nameLabel.textContent = "Full name";

        const nameInput = document.createElement("input");
        nameInput.type = "text";
        nameInput.name = "studentName";
        nameInput.placeholder = "Enter your full name";
        nameInput.autocomplete = "name";
        nameInput.required = true;
        nameInput.maxLength = 100;

        const idLabel = document.createElement("label");
        idLabel.textContent = "Student ID";

        const idInput = document.createElement("input");
        idInput.type = "text";
        idInput.name = "studentId";
        idInput.placeholder = "Enter student ID";
        idInput.required = true;
        idInput.maxLength = 50;

        const emailLabel = document.createElement("label");
        emailLabel.textContent = "Email address";

        const emailInput = document.createElement("input");
        emailInput.type = "email";
        emailInput.name = "studentEmail";
        emailInput.placeholder = "Enter email address";
        emailInput.autocomplete = "email";
        emailInput.required = true;
        emailInput.maxLength = 254;

        const formButtons = document.createElement("div");
        formButtons.className = "button-row";

        const submitButton = document.createElement("button");
        submitButton.type = "submit";
        submitButton.textContent = "Confirm";

        const closeButton = document.createElement("button");
        closeButton.type = "button";
        closeButton.className = "secondary";
        closeButton.textContent = "Close";

        closeButton.addEventListener("click", () => {
            registrationForm.classList.remove("show");
        });

        formButtons.append(submitButton, closeButton);

        registrationForm.append(
            nameLabel, nameInput,
            idLabel, idInput,
            emailLabel, emailInput,
            formButtons
        );

        registrationForm.addEventListener("submit", eventObject => {
            eventObject.preventDefault();

            registerStudent(event.id, {
                name: nameInput.value.trim(),
                studentId: idInput.value.trim(),
                email: emailInput.value.trim()
            });
        });

        card.append(
            title,
            description,
            meta,
            seats,
            buttons,
            registrationForm
        );

        eventsList.appendChild(card);
    });
}

// -----------------------------------------
// OPEN REGISTRATION FORM
// -----------------------------------------

function showRegistrationForm(eventId) {
    const forms = eventsList.querySelectorAll(".registration-form");

    forms.forEach(form => {
        form.classList.toggle(
            "show",
            form.dataset.eventId === eventId
        );
    });
}

// -----------------------------------------
// REGISTER STUDENT
// -----------------------------------------

function registerStudent(eventId, student) {
    const event = data.events.find(item => item.id === eventId);

    if (!event) {
        showMessage("Event not found.");
        return;
    }

    if (!student.name || !student.studentId || !student.email) {
        showMessage("Please complete all registration fields.");
        return;
    }

    const existing = data.registrations.find(registration =>
        registration.eventId === eventId &&
        registration.studentId.toLowerCase() ===
            student.studentId.toLowerCase()
    );

    if (existing) {
        showMessage("This student ID is already registered for this event.");
        return;
    }

    if (getRegisteredCount(eventId) >= Number(event.capacity)) {
        showMessage("Sorry, this event is full.");
        renderEvents();
        return;
    }

    const previousStudent = currentStudent;

    currentStudent = {
        name: student.name,
        studentId: student.studentId,
        email: student.email
    };

    data.registrations.push({
        id: crypto.randomUUID
            ? crypto.randomUUID()
            : String(Date.now()) + Math.random(),
        eventId: eventId,
        name: student.name,
        studentId: student.studentId,
        email: student.email,
        registeredAt: new Date().toISOString()
    });

    if (!saveData()) {
        data.registrations.pop();
        currentStudent = previousStudent;
        return;
    }

    showMessage(`Successfully registered for "${event.title}"!`);

    renderAll();
}

// -----------------------------------------
// CANCEL REGISTRATION
// -----------------------------------------

function cancelRegistration(eventId, studentId = null) {
    const registrations = getEventRegistrations(eventId);

    let target = null;

    if (studentId) {
        target = registrations.find(registration =>
            registration.studentId.toLowerCase() ===
            studentId.toLowerCase()
        );
    } else if (currentStudent) {
        target = registrations.find(registration =>
            registration.studentId.toLowerCase() ===
            currentStudent.studentId.toLowerCase()
        );
    } else if (registrations.length > 0) {
        target = registrations[0];
    }

    if (!target) {
        showMessage("No matching registration was found.");
        return;
    }

    const event = data.events.find(item => item.id === eventId);

    data.registrations = data.registrations.filter(
        registration => registration.id !== target.id
    );

    if (!saveData()) {
        data.registrations.push(target);
        return;
    }

    showMessage(
        `Registration cancelled${event ? " for " + event.title : ""}.`
    );

    renderAll();
}

// -----------------------------------------
// DELETE EVENT
// -----------------------------------------

function deleteEvent(eventId) {
    const event = data.events.find(item => item.id === eventId);

    if (!event) {
        showMessage("Event not found.");
        return;
    }

    const confirmed = window.confirm(
        `Delete "${event.title}" and all its registrations?`
    );

    if (!confirmed) {
        return;
    }

    const previousEvents = data.events;
    const previousRegistrations = data.registrations;

    data.events = data.events.filter(item => item.id !== eventId);
    data.registrations = data.registrations.filter(
        registration => registration.eventId !== eventId
    );

    if (!saveData()) {
        data.events = previousEvents;
        data.registrations = previousRegistrations;
        return;
    }

    showMessage(`"${event.title}" has been deleted.`);
    renderAll();
}

// -----------------------------------------
// RENDER MY REGISTRATIONS
// -----------------------------------------

function renderRegistrations() {
    registrationsList.replaceChildren();

    // Show registrations belonging to the current student.
    // On a fresh page load, ask for the student ID to retrieve them.
    let visibleRegistrations = [];

    if (currentStudent) {
        visibleRegistrations = data.registrations.filter(registration =>
            registration.studentId.toLowerCase() ===
            currentStudent.studentId.toLowerCase()
        );
    }

    if (!currentStudent && data.registrations.length > 0) {
        const lookupForm = document.createElement("form");
        lookupForm.className = "full";
        lookupForm.style.gridColumn = "1 / -1";

        const label = document.createElement("p");
        label.textContent =
            "Enter your student ID to view your saved registrations.";

        const input = document.createElement("input");
        input.type = "text";
        input.placeholder = "Student ID";
        input.required = true;
        input.maxLength = 50;
        input.style.width = "100%";
        input.style.marginBottom = "8px";

        const button = document.createElement("button");
        button.textContent = "Find my registrations";

        lookupForm.append(label, input, button);

        lookupForm.addEventListener("submit", event => {
            event.preventDefault();

            const studentId = input.value.trim();

            const match = data.registrations.find(registration =>
                registration.studentId.toLowerCase() ===
                studentId.toLowerCase()
            );

            if (!match) {
                showMessage("No registrations found for that student ID.");
                return;
            }

            currentStudent = {
                name: match.name,
                studentId: match.studentId,
                email: match.email
            };

            showMessage(`Welcome back, ${match.name}!`);
            renderAll();
        });

        registrationsList.appendChild(lookupForm);
    }

    if (visibleRegistrations.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty-state";
        empty.textContent = currentStudent
            ? "You haven't registered for any events yet."
            : "Your registered events will appear here.";

        registrationsList.appendChild(empty);
        return;
    }

    visibleRegistrations.forEach(registration => {
        const event = data.events.find(
            item => item.id === registration.eventId
        );

        if (!event) return;

        const card = document.createElement("article");
        card.className = "registration-card";

        const title = document.createElement("h3");
        title.textContent = event.title;

        const description = document.createElement("p");
        description.textContent = event.description;

        const meta = document.createElement("p");
        meta.className = "event-meta";
        meta.textContent =
            `${event.category} · ${formatDate(event.date)} · ${event.location}`;

        const seats = document.createElement("p");
        seats.className = "event-meta";
        seats.textContent =
            `${getRegisteredCount(event.id)}/${event.capacity} seats filled`;

        const cancelButton = document.createElement("button");
        cancelButton.textContent = "Cancel registration";

        cancelButton.addEventListener("click", () => {
            cancelRegistration(event.id, registration.studentId);
        });

        const registeredBy = document.createElement("p");
        registeredBy.className = "registered-by";
        registeredBy.textContent =
            `Registered by: ${registration.name} · ID: ${registration.studentId} · ${registration.email}`;

        card.append(
            title,
            description,
            meta,
            seats,
            cancelButton,
            registeredBy
        );

        registrationsList.appendChild(card);
    });
}

// -----------------------------------------
// ADD EVENT
// -----------------------------------------

eventForm.addEventListener("submit", eventObject => {
    eventObject.preventDefault();

    const title = document.getElementById("eventTitle").value.trim();
    const description = document.getElementById("eventDescription").value.trim();
    const category = document.getElementById("eventCategory").value;
    const date = document.getElementById("eventDate").value;
    const location = document.getElementById("eventLocation").value.trim();
    const capacity = Number(document.getElementById("eventCapacity").value);

    if (!title || !description || !date || !location) {
        showMessage("Please fill in all event details.");
        return;
    }

    if (!Number.isInteger(capacity) || capacity < 1 || capacity > 100000) {
        showMessage("Capacity must be a whole number between 1 and 100000.");
        return;
    }

    if (Number.isNaN(new Date(date).getTime())) {
        showMessage("Please enter a valid event date.");
        return;
    }

    const newEvent = {
        id: crypto.randomUUID
            ? crypto.randomUUID()
            : String(Date.now()) + Math.random(),
        title,
        description,
        category,
        date,
        location,
        capacity
    };

    data.events.push(newEvent);

    if (!saveData()) {
        data.events.pop();
        return;
    }

    eventForm.reset();

    showMessage(`Event "${title}" added successfully!`);

    // Make the newly created event visible even if a filter was active.
    searchInput.value = "";
    categoryFilter.value = "";

    renderAll();
});

// -----------------------------------------
// SEARCH AND FILTER
// -----------------------------------------

searchInput.addEventListener("input", renderEvents);
categoryFilter.addEventListener("change", renderEvents);

// -----------------------------------------
// RENDER EVERYTHING
// -----------------------------------------

function renderAll() {
    renderEvents();
    renderRegistrations();
}

// Initial render
renderAll();
</script>

</body>
</html>
